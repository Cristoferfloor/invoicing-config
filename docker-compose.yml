services:
  config:
    build: .
    image: config-service:0.2.0
    container_name: config-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CONFIG_PORT:-3003}:3003"
    env_file:
      - .env
    networks: [pac-invoicing-v2]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# La red la crea Infrastructure/docker-compose.yml: levantar eso primero.
networks:
  pac-invoicing-v2:
    external: true
